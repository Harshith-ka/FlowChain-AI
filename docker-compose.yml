services:
  db:
    image: postgres:16-alpine
    container_name: flowchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowchain
      POSTGRES_PASSWORD: flowchain_secret
      POSTGRES_DB: flowchain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowchain -d flowchain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowchain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: flowchain-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://flowchain:flowchain_secret@db:5432/flowchain_db
      - REDIS_URL=redis://redis:6379/0
      - APP_SECRET_KEY=flowchain-super-secure-production-secret-key-change-me-in-prod-32bytes
      - APP_ENV=production
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: flowchain-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
